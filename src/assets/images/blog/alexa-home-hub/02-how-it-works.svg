<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" rx="16" fill="#ffffff"/>

  <!-- Cloud zone -->
  <rect x="20" y="20" width="960" height="230" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="40" y="48" font-size="16" font-weight="700" fill="#9a3412">Amazon and AWS (Sydney)</text>
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <rect x="40" y="90" width="190" height="110" rx="10" fill="#fff" stroke="#f59e0b"/>
    <text x="135" y="138" font-weight="700">Alexa</text><text x="135" y="162" font-size="13" fill="#4b5563">speech to text</text>
    <rect x="290" y="90" width="190" height="110" rx="10" fill="#fff" stroke="#f59e0b"/>
    <text x="385" y="138" font-weight="700">Skill Lambda</text><text x="385" y="162" font-size="13" fill="#4b5563">waits up to 5 s</text>
    <rect x="540" y="90" width="190" height="110" rx="10" fill="#fff" stroke="#f59e0b"/>
    <text x="635" y="138" font-weight="700">IoT Core</text><text x="635" y="162" font-size="13" fill="#4b5563">message broker</text>
    <rect x="790" y="90" width="190" height="110" rx="10" fill="#fff" stroke="#f59e0b"/>
    <text x="885" y="138" font-weight="700">DynamoDB</text><text x="885" y="162" font-size="13" fill="#4b5563">replies, kept 5 min</text>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="232" y1="145" x2="288" y2="145"/>
    <line x1="482" y1="145" x2="538" y2="145"/>
    <line x1="732" y1="145" x2="788" y2="145"/>
    <path d="M885 88 V70 H385 V86"/>
  </g>
  <text x="635" y="63" font-size="13" fill="#4b5563" text-anchor="middle">the Lambda reads the reply from the table</text>

  <!-- Home zone -->
  <rect x="20" y="300" width="960" height="300" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="40" y="328" font-size="16" font-weight="700" fill="#155e75">My home network</text>
  <rect x="40" y="380" width="190" height="110" rx="10" fill="#fff" stroke="#0891b2"/>
  <text x="135" y="428" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Echo</text>
  <text x="135" y="452" font-size="13" fill="#4b5563" text-anchor="middle">"ask ramesh dude…"</text>
  <line x1="135" y1="378" x2="135" y2="202" stroke="#374151" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="145" y="280" font-size="13" fill="#4b5563">voice</text>
  <text x="40" y="530" font-size="13" fill="#155e75">Nothing at home accepts</text>
  <text x="40" y="548" font-size="13" fill="#155e75">connections from the internet.</text>

  <rect x="330" y="360" width="630" height="210" rx="10" fill="#fff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="350" y="390" font-size="15" font-weight="700" fill="#1f2937">The 2015 laptop: Hearth hub</text>
  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <rect x="350" y="410" width="180" height="80" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="440" y="444" font-weight="700">qwen2.5:3b</text><text x="440" y="466" font-size="12" fill="#4b5563">picks a tool (on the GPU)</text>
    <rect x="560" y="410" width="180" height="80" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="650" y="444" font-weight="700">Policy check</text><text x="650" y="466" font-size="12" fill="#4b5563">deny by default</text>
    <rect x="770" y="410" width="170" height="80" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="855" y="444" font-weight="700">Tool runs</text><text x="855" y="466" font-size="12" fill="#4b5563">e.g. read disk space</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#a)">
    <line x1="532" y1="450" x2="558" y2="450"/>
    <line x1="742" y1="450" x2="768" y2="450"/>
  </g>
  <text x="350" y="522" font-size="13" fill="#4b5563">Code writes the sentence Alexa speaks.</text>
  <text x="350" y="542" font-size="13" fill="#4b5563">The model never sees the tool's result.</text>
  <!-- Link between zones -->
  <g stroke="#0e7490" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)">
    <line x1="605" y1="202" x2="605" y2="358"/>
    <line x1="665" y1="358" x2="665" y2="202"/>
  </g>
  <text x="595" y="275" font-size="13" fill="#0e7490" text-anchor="end">command</text>
  <text x="675" y="275" font-size="13" fill="#0e7490">reply</text>
  <text x="675" y="293" font-size="12" fill="#4b5563">one connection, opened by the laptop</text>

</svg>
