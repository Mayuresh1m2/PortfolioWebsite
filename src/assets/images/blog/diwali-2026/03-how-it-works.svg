<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="420" rx="16" fill="#ffffff"/>

  <rect x="20" y="20" width="960" height="380" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="40" y="48" font-size="16" font-weight="700" fill="#166534">Everything inside the house, on your own Wi-Fi</text>

  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <rect x="40" y="110" width="170" height="110" rx="10" fill="#fff" stroke="#22c55e"/>
    <text x="125" y="156" font-weight="700">Phone</text><text x="125" y="180" font-size="13" fill="#4b5563">browser page, camera</text>

    <rect x="290" y="80" width="250" height="170" rx="10" fill="#fff" stroke="#22c55e"/>
    <text x="415" y="116" font-weight="700">Laptop</text>
    <text x="415" y="146" font-size="13" fill="#4b5563">receives the video (WebRTC)</text>
    <text x="415" y="170" font-size="13" fill="#4b5563">finds hands / body / badges</text>
    <text x="415" y="194" font-size="13" fill="#4b5563">turns camera spots into wall spots</text>
    <text x="415" y="218" font-size="13" fill="#4b5563">health checks, event log</text>

    <rect x="620" y="110" width="170" height="110" rx="10" fill="#fff" stroke="#22c55e"/>
    <text x="705" y="156" font-weight="700">Game window</text><text x="705" y="180" font-size="13" fill="#4b5563">butterflies, diyas, videos</text>

    <rect x="830" y="110" width="130" height="110" rx="10" fill="#fff" stroke="#f59e0b"/>
    <text x="895" y="156" font-weight="700">Projector</text><text x="895" y="180" font-size="13" fill="#4b5563">HDMI or cast</text>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="212" y1="165" x2="288" y2="165"/>
    <line x1="542" y1="165" x2="618" y2="165"/>
    <line x1="792" y1="165" x2="828" y2="165"/>
  </g>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="250" y="150">video</text>
    <text x="580" y="150">positions</text>
  </g>
  <path d="M895 224 C 895 330, 125 330, 125 224" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
  <text x="510" y="352" font-size="14" fill="#4b5563" text-anchor="middle">The wall lights up, a hand moves in the light, the phone sees it. Round it goes.</text>
  <text x="510" y="378" font-size="13" fill="#6b7280" text-anchor="middle">Nothing is recorded or uploaded. Frames live in memory and are dropped.</text>
</svg>
